[package]
name = "ilp-core"
version = "0.1.0"
edition = "2021"
description = "ILP 小说阅读与下载核心 API"
license = "GPL-3.0-or-later"

[dependencies]
ilp-types = { version = "0.1.0", path = "../ilp-types" }
ilp-storage = { version = "0.1.0", path = "../ilp-storage" }
ilp-runtime = { version = "0.1.0", path = "../ilp-runtime" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros"] }
