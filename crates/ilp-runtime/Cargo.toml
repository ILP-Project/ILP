[package]
name = "ilp-runtime"
version = "0.1.0"
edition = "2021"
description = "ILP WASM 插件运行时边界"
license = "GPL-3.0-or-later"

[dependencies]
ilp-types = { version = "0.1.0", path = "../ilp-types" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
wasmtime = "48"
wasmtime-wasi = { version = "48", default-features = false, features = ["p1"] }
