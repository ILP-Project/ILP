[workspace]
resolver = "2"
members = [
    "crates/ilp-types",
    "crates/ilp-plugin-wit",
    "crates/ilp-storage",
    "crates/ilp-runtime",
    "crates/ilp-core",
    "crates/ilp-host",
]
default-members = [
    "crates/ilp-types",
    "crates/ilp-plugin-wit",
    "crates/ilp-storage",
    "crates/ilp-runtime",
    "crates/ilp-core",
    "crates/ilp-host",
]
exclude = ["plugins/template"]

[profile.release]
opt-level = "s"
lto = true
