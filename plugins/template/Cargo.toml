[package]
name = "ilp-plugin-@CRATE_NAME@"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
ilp-plugin-wit = { git = "https://github.com/ILP-Project/ILP", tag = "abi-v0.2.0" }
serde = { version = "1", features = ["derive"] }
base64 = "0.22"
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
