[package]
name = "ilp-plugin-fanqie"
version = "1.0.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen = "0.46"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
aes = "0.8"
cbc = "0.1"
md5 = { package = "md-5", version = "0.10" }
flate2 = "1"
base64 = "0.22"
sha2 = "0.10"
