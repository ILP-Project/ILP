name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            name: linux-x86_64
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            name: linux-aarch64
          - target: x86_64-apple-darwin
            os: macos-13
            name: macos-x86_64
          - target: aarch64-apple-darwin
            os: macos-14
            name: macos-aarch64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
      - name: Install musl toolchain
        if: contains(matrix.target, 'musl')
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y musl-tools
          if [ '${{ matrix.target }}' = 'aarch64-unknown-linux-musl' ]; then
            curl -fsSL https://musl.cc/aarch64-linux-musl-cross.tgz -o /tmp/musl.tgz
            sudo tar -xzf /tmp/musl.tgz -C /opt
            echo /opt/aarch64-linux-musl-cross/bin >> "$GITHUB_PATH"
          fi
      - run: rustup target add ${{ matrix.target }}
      - name: Build
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: aarch64-linux-musl-gcc
          CC_aarch64_unknown_linux_musl: aarch64-linux-musl-gcc
          AR_aarch64_unknown_linux_musl: aarch64-linux-musl-ar
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        run: |
          set -euo pipefail
          archive=ilp-${{ github.ref_name }}-${{ matrix.name }}
          install -Dm755 target/${{ matrix.target }}/release/ilp ilp
          tar -czf "$archive.tar.gz" ilp LICENSE README.md
          rm ilp
          sha256sum "$archive.tar.gz" > "$archive.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            *.tar.gz
            *.tar.gz.sha256

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create checksum manifest
        working-directory: dist
        run: |
          set -euo pipefail
          cat *.tar.gz.sha256 > SHA256SUMS
          rm *.tar.gz.sha256
      - name: Sign checksum manifest
        working-directory: dist
        env:
          ILP_SIGNING_KEYS: ${{ secrets.ILP_SIGNING_KEYS }}
        run: |
          set -euo pipefail
          test -n "${ILP_SIGNING_KEYS:-}" || { echo 'ILP_SIGNING_KEYS is required' >&2; exit 1; }
          python3 - <<'PY'
          import base64, json, os
          from cryptography.hazmat.primitives.asymmetric.ed25519 import Ed25519PrivateKey
          raw = open('SHA256SUMS', 'rb').read()
          signatures = []
          for item in os.environ['ILP_SIGNING_KEYS'].split(','):
              key_id, _, encoded = item.strip().partition(':')
              if not key_id:
                  continue
              seed = base64.b64decode(encoded)
              if len(seed) != 32:
                  raise SystemExit(f'{key_id}: expected a 32-byte seed')
              signature = Ed25519PrivateKey.from_private_bytes(seed).sign(raw)
              signatures.append({
                  'key_id': key_id,
                  'signature': base64.b64encode(signature).decode(),
              })
          if not signatures:
              raise SystemExit('no signing keys configured')
          value = signatures[0] if len(signatures) == 1 else signatures
          with open('SHA256SUMS.sig', 'w') as file:
              json.dump(value, file, indent=2)
              file.write('\n')
          PY
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS
            dist/SHA256SUMS.sig
          fail_on_unmatched_files: true
          generate_release_notes: true
