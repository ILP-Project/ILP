name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --workspace
        timeout-minutes: 15
      - run: cargo build
      - name: Test installer
        run: |
          python3 -m pip install --quiet cryptography
          sh scripts/install_test.sh

  plugin-skeleton:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
        with:
          key: wasm
      - run: rustup target add wasm32-wasip2
      - run: cargo build
      - name: Generate skeleton
        run: |
          set -euo pipefail
          mkdir -p /tmp/skeleton
          ./target/debug/ilp plugin new ci-demo \
            --site-name 'CI Demo' \
            --site-id ci-demo \
            --domain example.com \
            --dir /tmp/skeleton
      - name: Check generated dependency
        run: |
          set -euo pipefail
          file=/tmp/skeleton/ci-demo/Cargo.toml
          ! grep -q 'path *=.*crates/ilp-plugin-wit' "$file"
          grep -n ilp-plugin-wit "$file"
      - name: Use current ABI source
        run: |
          set -euo pipefail
          file=/tmp/skeleton/ci-demo/Cargo.toml
          sed -i "s|git = \"https://github.com/ILP-Project/ILP\", tag = \"abi-v0.2.0\"|path = \"${{ github.workspace }}/crates/ilp-plugin-wit\"|" "$file"
      - name: Build skeleton
        working-directory: /tmp/skeleton/ci-demo
        run: |
          cargo fmt --check
          cargo clippy --target wasm32-wasip2 -- -D warnings
          cargo build --target wasm32-wasip2 --release
      - name: Verify component
        run: |
          set -euo pipefail
          wasm=/tmp/skeleton/ci-demo/target/wasm32-wasip2/release/ilp_plugin_ci_demo.wasm
          test -f "$wasm"
          python3 - "$wasm" <<'PY'
          import sys
          data = open(sys.argv[1], "rb").read()
          if data[:4] != b"\0asm" or data[6:8] != b"\x01\x00":
              raise SystemExit("generated file is not a WebAssembly component")
          PY
